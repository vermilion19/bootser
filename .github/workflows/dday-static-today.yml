# dday-static 「오늘 한 장」 다시 만들기
#
# /today/ 는 이 사이트에서 날짜 자체가 자료인 유일한 페이지다. 나머지 548장은
# HTML 에 날짜만 적어 두고 D-day 를 브라우저가 붙이므로 몇 달을 두어도 낡지 않는데,
# 이 한 장은 박아 둔 요약이 그날 것이다 — 「오늘은 무슨 날」에 답하려면 그 답이
# 원본 HTML 안에 있어야 하고(스니펫은 렌더 전 HTML 에서 뽑힌다), 그러면 하루가
# 지나는 순간 낡는다.
#
# 자료를 새로 받지 않는다. Nager.Date 를 부르는 것은 매월 1일의
# dday-static-refresh.yml 하나뿐이고, 여기서는 이미 커밋된 자료를 다시 자를 뿐이다.
#
# gen-pages.mjs 는 550장을 통째로 다시 쓰지만, 자료가 그대로면 나머지 548장은
# 바이트까지 같다 — 그래서 커밋에 담기는 것은 /today/ 두 장과 sitemap.xml 뿐이다.
#
# 시각을 15:05 UTC 로 둔 까닭. 그때가 KST 00:05 라, 한국어 페이지는 한국의 하루가
# 시작하자마자 그날 것이 된다. 영어 페이지는 UTC 로 찍히므로 이 시각에는 아직
# 「오늘」이 맞고(UTC 로는 같은 날 오후), UTC 자정부터 이 작업이 돌 때까지 열다섯
# 시간은 하루 뒤처진다. 한국어 쪽을 먼저 맞추는 선택이고, 어긋나는 동안에는
# dday.js 가 화면에 그렇게 적는다(#tdrift). 영어 쪽까지 늘 맞추려면 cron 을
# '5 0 * * *' 로 한 줄 더 두면 되는데, 그러면 커밋이 하루 두 번이다.

name: dday-static 오늘 한 장

on:
  schedule:
    - cron: '5 15 * * *'      # 매일 15:05 UTC (KST 00:05)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dday-static-today
  cancel-in-progress: false   # 커밋하는 작업이라 중간에 끊지 않는다

defaults:
  run:
    working-directory: frontends/dday-static

jobs:
  today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen-sitemap.mjs 가 파일마다 `git log -1` 로 lastmod 를 뽑는다.
          # 얕은 클론이면 이력이 없어 전부 오늘로 찍히고, 구글은 부정확한
          # lastmod 를 아예 무시한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 의존성이 없다. npm install 도, 캐시도 필요 없다.

      # 네트워크를 타지 않는다. 이미 커밋된 data/*.json 과 sky.json 만 본다.
      - name: 페이지 다시 만들기
        run: node tools/gen-pages.mjs

      - name: 바뀐 게 있나
        id: diff
        run: |
          if git status --porcelain . | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- . | tail -1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 것이 없다 — 같은 날에 두 번 돌았을 때만 여기로 온다."
          fi

      - name: 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .
          git commit \
            -m "chore(frontends): dday-static 오늘 한 장 ($(TZ=Asia/Seoul date +%Y-%m-%d))" \
            -m "/today/ 와 /en/today/ 를 그날 날짜로 다시 만들었습니다. 새로 받아 온 자료는 없습니다." \
            -m ".github/workflows/dday-static-today.yml 가 매일 15:05 UTC(KST 00:05)에 돌립니다."

      # 순서가 중요하다. lastmod 는 커밋 날짜에서 뽑으므로 커밋 뒤에 만들어야
      # 하고, 그러면 sitemap.xml 자체가 커밋 안 된 상태로 남아 amend 로 합친다.
      - name: sitemap 다시 만들기
        if: steps.diff.outputs.changed == 'true'
        run: node tools/gen-sitemap.mjs

      # --fresh 가 「박아 둔 날짜가 오늘인가」를 주의에서 실패로 올린다.
      # 사람이 저장소에서 돌릴 때는 어제 만든 페이지가 들어 있는 것이 정상이라
      # 그쪽은 주의로 두고, 배포로 나가는 이 길만 막는다.
      - name: 검사 — 실패하면 밀지 않는다
        if: steps.diff.outputs.changed == 'true'
        run: node tools/check-pages.mjs --fresh

      - name: sitemap 을 같은 커밋에 합치기
        if: steps.diff.outputs.changed == 'true'
        run: |
          if ! git diff --quiet; then
            git add -A .
            git commit --amend --no-edit
          fi

      - name: 푸시
        if: steps.diff.outputs.changed == 'true'
        run: git push

server:
  port: 8080

spring:
  application:
    name: d-day-service
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false

  # 스케줄 작업이 여덟이다 (ARCHITECTURE.md §5.6 + SCHEMA.md §10).
  #
  # 이 값은 **지금 아무 일도 안 한다.** 위의 threads.virtual.enabled 가 켜져 있으면
  # Spring Boot 4.0.1 은 TaskScheduler 로 SimpleAsyncTaskScheduler 를 놓고, 그것은
  # 스케줄마다 가상 스레드를 새로 뽑아 풀 크기라는 개념 자체가 없다
  # (TaskSchedulingConfigurations 의 @ConditionalOnThreading(VIRTUAL)).
  # ARCHITECTURE.md §10-4 가 「확인 필요」로 열어 둔 것이 이것이고, 확인해서 닫았다.
  #
  # 그래도 지워 두지 않는다. 가상 스레드를 끄는 순간 기본 풀 크기가 1 로 돌아오고,
  # 그러면 공휴일 동기화(수십 분)가 그 하나를 붙들어 Outbox 릴레이가 수십 분 멈춘다.
  # 로그에는 아무 에러도 안 찍힌다 — 그 조용한 고장에 대한 안전망이다.
  task:
    scheduling:
      pool:
        size: 10

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: d-day-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# d-day 자체 설정
dday:
  cache:
    sky:
      # sky 캐시 키의 v{A}. 동기화가 아니라 **배포가 올린다** (ARCHITECTURE.md §4.2).
      # astro-core 의 계산이 바뀌면 이 값을 올려서 배포한다.
      algorithm-version: 1
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 3000
  country:
    seed:
      # 부팅할 때 seed/country.tsv 를 표에 넣는다 (SPEC.md §9.2).
      # 동기화가 아니라 시드라 스케줄도 수동 트리거도 없다 — 배포가 곧 갱신이다.
      enabled: true
  sync:
    holiday:
      scheduled: true
      # 주 1회. 공휴일은 거의 안 변하고 실패 비용이 낮다 — 다음 주에 다시 돈다
      # (ARCHITECTURE.md §5.1). 한 회차가 2,040 호출이라 자주 돌면 그 자체가 부담이다.
      cron: "0 10 3 * * MON"
      base-url: https://date.nager.at

      # 담는 연도 범위 = 이 서비스의 **정의역**이다 (ARCHITECTURE.md §4.1).
      # 이 범위 밖의 날짜로 오는 요청은 캐시에 닿기 전에 400 으로 잘린다.
      # 고정 연도가 아니라 「올해 기준 몇 해」다 — 고정이면 해가 바뀌는 날
      # 아무도 모르게 정의역이 낡는다. SCHEMA.md §13.3 의 S-2 가 이 값이다.
      back-years: 1
      forward-years: 2

      rate-limit:
        # 가상 스레드가 동시성의 상한을 없앴으므로 **이것이 유일한 제한자**다.
        # 이게 없으면 1,020 요청이 한꺼번에 나가 무료 API 를 우리가 DoS 하는 셈이 된다.
        permits-per-second: 5
        # 허가를 기다리는 상한. 2,040 호출 ÷ 5rps ≈ 7분이라 그보다 넉넉히 둔다 —
        # 짧으면 뒤쪽 나라들이 줄을 서다 실패로 기록된다.
        wait-timeout: 15m

      # 소켓에서 먼저 실패해야 회로가 그것을 실패로 기록한다 (ARCHITECTURE.md §5.5).
      # 이 둘의 합이 TimeLimiter(4s)보다 짧아야 한다.
      connect-timeout: 1s
      read-timeout: 3s

    # 경기 일정 (SPEC.md §12). **키가 없으면 아예 안 돈다.**
    #
    # 키 없이 돌리면 원천이 401 을 주고 그것이 회차마다 실패로 기록되어,
    # 실패 기록이 「원천이 이상하다」를 뜻하지 않게 된다 — 켤 수 없는 것은
    # 꺼져 있는 것으로 보여야 한다. scheduled 도 기본이 꺼짐이다.
    sports:
      scheduled: false
      # 10분. 창이 끊기면 경기를 놓치고(무료 키는 「다음 1건」만 준다),
      # 우천 순연은 경기 당일에 정해진다 (ARCHITECTURE.md §5.1).
      fixed-delay-ms: 600000
      base-url: https://www.thesportsdb.com
      # 공개 저장소에 적지 않는다. 환경변수 DDAY_SYNC_SPORTS_API_KEY 로 준다.
      api-key: ${DDAY_SYNC_SPORTS_API_KEY:}
      # 유료 키가 있어 시즌 전수를 받을 수 있나. 무료 키로 켜면 시즌 질의가
      # 5건만 돌려주는데 에러가 아니라서 「시즌에 5경기」로 조용히 담긴다 (§12.2).
      bulk: false
      leagues:
        # 1차에 켤 리그는 KBO 다 (SPEC.md §12.1). 근거는 성능이 아니라
        # **D-4 가 실제로 발동한다**는 것이다 — 우천 순연이 일상이라
        # 변경 감지 → 이벤트 → 알림 사슬을 시즌 내내 여러 번 밟는다.
        # 축구를 켜면 그 사슬이 한 번도 안 돌 수 있다.
        - external-id: "4830"
          sport: Baseball
          # 팀 목록을 **이 이름으로** 받는다. id 로 받는 길은 무료 키에서
          # 언제나 잉글랜드 3부 24팀을 주고 HTTP 200 이다 (SPEC.md §12.3).
          name: Korean KBO League
          country-code: KR
          zone: Asia/Seoul
          # 야구는 연도 하나가 시즌이다. 유럽 축구는 2025-2026 꼴이다.
          season: "2026"
      rate-limit:
        # 공휴일(5rps)보다 느리다. 창 누적은 리그당 2~3 호출이라 빠를 필요가 없고,
        # 이 원천은 무료 키 제한이 명시돼 있지 않아 모를 때는 천천히 간다.
        permits-per-second: 2
        wait-timeout: 5m
      connect-timeout: 1s
      read-timeout: 3s

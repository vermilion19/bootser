server:
  port: 8080

spring:
  application:
    name: d-day-service
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false

  # 스케줄 작업이 여덟이다 (ARCHITECTURE.md §5.6 + SCHEMA.md §10).
  #
  # 이 값은 **지금 아무 일도 안 한다.** 위의 threads.virtual.enabled 가 켜져 있으면
  # Spring Boot 4.0.1 은 TaskScheduler 로 SimpleAsyncTaskScheduler 를 놓고, 그것은
  # 스케줄마다 가상 스레드를 새로 뽑아 풀 크기라는 개념 자체가 없다
  # (TaskSchedulingConfigurations 의 @ConditionalOnThreading(VIRTUAL)).
  # ARCHITECTURE.md §10-4 가 「확인 필요」로 열어 둔 것이 이것이고, 확인해서 닫았다.
  #
  # 그래도 지워 두지 않는다. 가상 스레드를 끄는 순간 기본 풀 크기가 1 로 돌아오고,
  # 그러면 공휴일 동기화(수십 분)가 그 하나를 붙들어 Outbox 릴레이가 수십 분 멈춘다.
  # 로그에는 아무 에러도 안 찍힌다 — 그 조용한 고장에 대한 안전망이다.
  task:
    scheduling:
      pool:
        size: 10

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: d-day-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always

# d-day 자체 설정
dday:
  cache:
    sky:
      # sky 캐시 키의 v{A}. 동기화가 아니라 **배포가 올린다** (ARCHITECTURE.md §4.2).
      # astro-core 의 계산이 바뀌면 이 값을 올려서 배포한다.
      algorithm-version: 1
  outbox:
    relay:
      enabled: true
      fixed-delay-ms: 3000

# DB 없이 띄워 보는 프로필. 인메모리라 켤 때마다 새로 만든다.
#
# 여기서만 ddl-auto 가 create-drop 이다 — 엔티티에서 스키마가 나온다.
# 그래서 **인덱스도 부분 제약도 여기엔 없다.** scripts/schema.sql 과 이 프로필이
# 갈라지는 것을 막는 것이 SchemaDriftTest · SchemaIndexTest 다 (docs/SCHEMA.md §11.4).
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dday;MODE=PostgreSQL
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  h2:
    console:
      enabled: true
      path: /h2-console

# DB 도 Redis 도 없이 띄워 보는 프로필이라 릴레이를 끈다.
# 켜 두면 3초마다 ShedLock 이 Redis 를 찾다 실패해 로그가 그것으로 뒤덮이고,
# 진짜 에러가 그 속에 묻힌다.
dday:
  outbox:
    relay:
      enabled: false
  country:
    seed:
      # DB 도 Redis 도 없이 띄워 보는 프로필이라 시드도 끈다.
      # 인메모리 H2 라 켜 두면 켤 때마다 204행을 다시 넣는데, 그것이 「시드가
      # 들어갔다」는 착각을 준다 — 운영에서는 판이 박히는 일회성 작업이다.
      enabled: false
  sync:
    holiday:
      # 남의 서버를 때리는 일이라 기본으로 끈다. DB 도 Redis 도 없는 프로필이고,
      # 켜 두면 띄울 때마다 Nager 를 2,040번 부른다.
      scheduled: false
    sports:
      # 남의 서버를 때리는 일이라 기본으로 끈다. 키가 없으면 어차피 안 돌지만
      # 켜 두면 10분마다 「건너뜀」 회차가 쌓여 회차 표가 그것으로 가득 찬다.
      scheduled: false
  fanout:
    # Kafka 없이 띄워 보는 프로필이라 컨슈머를 끈다. 켜 두면 브로커를 찾다
    # 실패하는 로그가 몇 초마다 쌓여 진짜 에러가 그 속에 묻힌다.
    enabled: false
  admin:
    # 운영자 주소는 게이트웨이를 안 타므로 X-User-Role 을 넣어 줄 사람이 없다.
    # 띄워 보는 프로필에서만 검사를 끈다 — 기본값은 켜짐이고, 끄는 쪽이
    # 설정을 적어야 한다.
    require-role: false
